<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mainwelle TV</title>
<style>
/* TV-Ansicht im Wechsel: erst alle Regional-News einmal durch, dann ein kompletter Benchmark-Durchlauf
   (Alle, Bayern, Oberfranken, Reference je mit drei Kennzahlen), dann ein kompletter Durchlauf der
   Social Insights (TV-Modus: alle Abschnitte Instagram, dann Facebook), dann wieder News.
   Fortschritt bis zum nächsten Wechsel: hellblauer Balken ganz oben am Bildschirmrand. Die Einzelseiten selbst bleiben unverändert. */
html,body{margin:0;height:100%;background:#0c1859;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
iframe.on{opacity:1;pointer-events:auto}
#kbar{position:fixed;top:0;left:0;height:6px;width:0;background:#89c9eb;z-index:10;transition:width .5s linear}
#kbar.reset{transition:none}
</style>
</head>
<body>
<div id="kbar"></div>
<iframe id="news" title="Regional-News"></iframe>
<iframe id="bench" title="Social Benchmark"></iframe>
<iframe id="ins" title="Social Insights"></iframe>
<script>
{
const NEWS = 'https://joshimainwelle2026.github.io/mainwelle-tv-dashboard/';
const ROTATE_MS = 12000;            // Taktung der Schlagzeilen im Newsdesk
const BENCH_MAX = 12 * 60 * 1000;   // Sicherheitsgrenze, falls kein Durchlauf-Signal kommt
const INS = 'https://joshimainwelle2026.github.io/v6t5zmnhoa6g2pkd1vbkqdh0d10gfg0x9cyqvatr9g9zmr9e/';
const INS_SEC_MS = 18000;           // Taktung der Abschnitte im Insights-TV-Modus
const news = document.getElementById('news'), bench = document.getElementById('bench'), ins = document.getElementById('ins');
let timer = null, phase = '', nStart = 0, nDur = 1;

const bar = document.getElementById('kbar');
// Eigenen Balken des Insights-Boards ausblenden, der Kombi-Balken zeigt den Gesamtfortschritt
function hideOwnBar(f) { try { const d = f.contentDocument; if (d && !d.getElementById('kx-style')) { const s = d.createElement('style'); s.id = 'kx-style'; s.textContent = '#tvbar{opacity:0!important}'; d.head.appendChild(s); } } catch (e) {} }
const prog = (p) => { p = Math.max(0, Math.min(1, p)); if (p === 0) { bar.classList.add('reset'); bar.style.width = '0'; void bar.offsetWidth; bar.classList.remove('reset'); } else bar.style.width = (p * 100) + '%'; };
setInterval(() => { if (phase === 'news') prog((Date.now() - nStart) / nDur); }, 500);

const load = (f, src) => new Promise((res) => { f.onload = () => setTimeout(res, 1500); f.src = src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(); });
const show = (f) => [news, bench, ins].forEach((x) => x.classList.toggle('on', x === f));

async function newsPhase() {
  phase = 'loading'; clearTimeout(timer); clearInterval(insT); prog(0);
  let n = 15;
  try { const d = await fetch(NEWS + 'news.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()); if (Array.isArray(d.items) && d.items.length) n = d.items.length; } catch (e) {}
  await load(news, NEWS);
  phase = 'news';
  show(news); prog(0);
  nStart = Date.now(); nDur = n * ROTATE_MS + 1000;
  timer = setTimeout(benchPhase, nDur);
}
async function benchPhase() {
  phase = 'loading'; clearTimeout(timer);
  await load(bench, './#tv');
  phase = 'bench';
  show(bench); prog(0);
  timer = setTimeout(newsPhase, BENCH_MAX);
}
window.addEventListener('message', (e) => {
  if (phase !== 'bench' || e.source !== bench.contentWindow) return;
  if (e.data && e.data.type === 'bm-progress') prog(e.data.p);
  if (e.data === 'bm-cycle-done') insPhase();
});
// Social Insights im TV-Modus: Fortschritt und Ende aus der Abschnittsanzeige unten (z. B. „Facebook · 8 / 8“) ablesen
let insT = null;
async function insPhase() {
  phase = 'loading'; clearTimeout(timer); clearInterval(insT);
  await load(ins, INS + '#tv');
  hideOwnBar(ins);
  phase = 'ins';
  show(ins); prog(0);
  const d = ins.contentDocument; let nIG = 9, nFB = 8, sawEnd = false;
  const start = Date.now();
  insT = setInterval(() => {
    if (phase !== 'ins') return clearInterval(insT);
    const m = (d.querySelector('.tvbadge span')?.textContent || '').match(/(Instagram|Facebook)\s*·\s*(\d+)\s*\/\s*(\d+)/);
    if (!m) return;
    const isIG = m[1] === 'Instagram', k = +m[2], n = +m[3];
    if (isIG) nIG = n; else nFB = n;
    if (!isIG && k === n) sawEnd = true;
    if (sawEnd && isIG) { clearInterval(insT); newsPhase(); return; }
    const w = parseFloat(d.getElementById('tvbar')?.style.width) || 0;
    prog(((isIG ? k - 1 : nIG + k - 1) + w / 100) / (nIG + nFB));
  }, 500);
  timer = setTimeout(newsPhase, 18 * INS_SEC_MS + 20000);
}
newsPhase();
}
</script>
</body>
</html>
